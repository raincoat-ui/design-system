packages:
  - "packages/*"
  - "packages/web-themes/*"
  - "apps/*"

# Supply chain
# Refuse versions published less than 7 days ago (value is in minutes).
minimumReleaseAge: 10080
# Fail if a package's publishing trust level drops compared to its earlier releases.
trustPolicy: no-downgrade
# Record exact versions, never ranges.
saveExact: true

# sharp bundles libvips, which is LGPL-3.0-or-later. The docs site does not process images,
# so the optional dependency is left out rather than excepted.
ignoredOptionalDependencies:
  - sharp

# Dependency install scripts are blocked unless reviewed here.
strictDepBuilds: true
allowBuilds:
  # lefthook's postinstall only installs git hooks; the root "prepare" script does that instead.
  lefthook: false
  # esbuild's postinstall only verifies the platform binary that pnpm already installed.
  esbuild: false
  # @parcel/watcher (the Tailwind CLI's file watcher) ships prebuilt binaries as optional
  # dependencies; its install script only compiles from source when asked to.
  "@parcel/watcher": false
