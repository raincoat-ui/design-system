# The text the Tabs' examples show, in every locale of the snapshot matrix
# (specs/snapshots.yaml): by example id, as in spec.yaml, then by the content the text fills.
# An example is a row of tabs, so its labels, or its accessible names, are one line per tab, in
# order. The expanded pseudo-locale is derived from the English by the token build; it is never
# written here.
#
# The labels are written as an app would ship them: in the sentence case and the words each
# language uses for these sections, in Unicode's composed form (NFC).
examples:
  labels:
    label:
      en: |-
        Details
        Reviews
        Shipping
      vi: |-
        Chi tiết
        Đánh giá
        Vận chuyển
      zh-Hans: |-
        详情
        评价
        配送
      ja: |-
        詳細
        レビュー
        配送
      ko: |-
        상세 정보
        리뷰
        배송
      ar: |-
        التفاصيل
        المراجعات
        الشحن
    panel:
      en: Made of waxed cotton, with taped seams.
      vi: Làm từ vải cotton phủ sáp, các đường may được dán kín.
      zh-Hans: 采用上蜡棉布制成，接缝处经过压胶处理。
      ja: ワックスコットン製で、縫い目はテープで防水加工されています。
      ko: 왁스 코튼으로 만들었으며 솔기는 테이프로 마감했습니다.
