# The text the Toast's examples show, in every locale of the snapshot matrix
# (specs/snapshots.yaml): by example id, as in spec.yaml, then by the content the text fills.
# The expanded pseudo-locale is derived from the English by the token build; it is never written
# here.
#
# The messages say what happened in a short sentence, and the actions use the words each
# language uses for them, in Unicode's composed form (NFC). The close label is never shown: it is
# the name of the close button.
examples:
  message:
    message:
      en: Message archived
      vi: Đã lưu trữ thư
      zh-Hans: 邮件已归档
      ja: メッセージをアーカイブしました
      ko: 메시지를 보관했습니다
      ar: تمت أرشفة الرسالة
  with-action:
    message:
      en: Address deleted
      vi: Đã xóa địa chỉ
      zh-Hans: 地址已删除
      ja: 住所を削除しました
      ko: 주소를 삭제했습니다
      ar: تم حذف العنوان
    action-label:
      en: Undo
      vi: Hoàn tác
      zh-Hans: 撤销
      ja: 元に戻す
      ko: 실행 취소
      ar: تراجع
    close-label:
      en: Close
      vi: Đóng
      zh-Hans: 关闭
      ja: 閉じる
      ko: 닫기
      ar: إغلاق
  long-message:
    message:
      en: Messages older than one year were moved from Archive to the Deleted folder
      vi: Các thư cũ hơn một năm đã được chuyển từ Lưu trữ sang thư mục Đã xóa
      zh-Hans: 超过一年的邮件已从归档移至“已删除”文件夹
      ja: 1年以上前のメッセージをアーカイブから削除済みフォルダに移動しました
      ko: 1년이 지난 메시지를 보관함에서 휴지통 폴더로 옮겼습니다
      ar: نُقلت الرسائل التي مضى عليها أكثر من عام من الأرشيف إلى مجلد المحذوفات
    action-label:
      en: Undo
      vi: Hoàn tác
      zh-Hans: 撤销
      ja: 元に戻す
      ko: 실행 취소
      ar: تراجع
    close-label:
      en: Close
      vi: Đóng
      zh-Hans: 关闭
      ja: 閉じる
      ko: 닫기
      ar: إغلاق
