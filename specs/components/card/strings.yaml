# The text the Card's examples show, in every locale of the snapshot matrix
# (specs/snapshots.yaml): by example id, as in spec.yaml, then by the content the text fills.
# The expanded pseudo-locale is derived from the English by the token build; it is never written
# here.
#
# The text is written as an app would ship it, in Unicode's composed form (NFC). The long title
# takes two lines in every locale, and in Vietnamese stacks diacritics on both. In
# media-and-footer, media is the image's text alternative, which is read but not shown, and
# footer is the label of the footer's Button.
examples:
  static:
    title:
      en: Storage
      vi: Dung lượng lưu trữ
      zh-Hans: 存储空间
      ja: ストレージ
      ko: 저장 공간
      ar: مساحة التخزين
    body:
      en: 4.2 GB of 15 GB used
      vi: Đã dùng 4,2 GB trong tổng số 15 GB
      zh-Hans: 已使用 4.2 GB，共 15 GB
      ja: 15 GB 中 4.2 GB を使用中
      ko: 15GB 중 4.2GB 사용 중
      ar: تم استخدام 4.2 غيغابايت من 15 غيغابايت
  interactive:
