# The platform-neutral contract of the Button. The React, SwiftUI, and Compose implementations
# all follow it; the variant and size types they use are generated from this file.
# Proposed and accepted in rfcs/0001-foundation-tokens-and-button.md.
id: button
name: Button
specVersion: 1.1.0
rfc: 1
group: Actions
summary: Triggers an action or submits a form.

properties:
  variant:
    description: How much emphasis the action gets.
    default: secondary
    values:
      primary: The main action in a view. At most one per view.
      secondary: An alternative action beside the primary one.
      ghost: A low-emphasis action with no fill at rest.
      danger: A destructive action, such as deleting.
  size:
    description: The height and text size of the button.
    default: md
    values:
      sm: For dense layouts such as toolbars and tables.
      md: The default size.
      lg: For prominent calls to action.
  full-width:
    type: boolean
    default: false
    description: Stretches the button to the width of its container.
  disabled:
    type: boolean
    default: false
    description: Makes the button unavailable. It cannot be focused or activated.
  loading:
    type: boolean
    default: false
    description: Shows that the action is in progress. The label stays and activation is ignored.

content:
  label:
    description: The text of the button. Starts with a verb, in sentence case.
    required: unless an icon is the only content
  leading-icon:
    description: An icon before the label. Decorative when there is a label.
    required: false
  trailing-icon:
    description: An icon after the label. Decorative when there is a label.
    required: false
  accessible-name:
    description: The name read by assistive technology.
    required: when there is no label

anatomy:
  container:
    description: >-
      The shape that holds the content and receives input. It is square when an icon is the
      only content. Its size is the button's layout size.
    tokens:
      - button.radius
      - button.border-width
      - button.gap
      - button.height.*
      - button.padding-inline.*
      - button.target-minimum
  label:
    description: The button's text. It is centered and wraps when it does not fit.
    tokens:
      - button.label.*
  icon:
    description: An optional leading or trailing icon.
    tokens:
      - button.icon-size.*
  spinner:
    description: Replaces the leading icon while loading. Sized like an icon.
    tokens:
      - button.icon-size.*
  focus-ring:
    description: Drawn around the container, with a gap, when the button has keyboard focus.
    tokens:
      - button.focus-ring.width
      - button.focus-ring.offset
      - button.focus-ring.color

states:
  rest:
    description: The default appearance.
  hover:
    description: A pointer is over the button. Exists only where there is a pointer.
  focus-visible:
    description: The button has keyboard focus. The focus ring is shown.
  pressed:
    description: The button is being pressed.
  disabled:
    description: The button is unavailable. All variants look the same.
  loading:
    description: The action is in progress. A spinner is shown and the label stays.

accessibility:
  role: button
  name: The label. A button with only an icon must be given an accessible name.
  keyboard:
    - keys: [Enter, Space]
      action: Activates the button.
    - keys: [Tab]
      action: Moves focus to and from the button. A disabled button is skipped.
  disabled: Not focusable and not activatable. Exempt from contrast requirements.
  loading: >-
    Stays focusable and keeps focus. Activation is ignored. Assistive technology is told the
    button is busy.
  focus: >-
    A ring at least 2px wide with 3:1 contrast against the surface behind the button, shown for
    keyboard focus. On the web and on Android the button draws it from the focus ring tokens,
    because neither platform draws one for it. On iOS the system draws its own focus indicator,
    which follows the person's Full Keyboard Access settings.
  target-size: >-
    The area that takes touches is at least 44pt on iOS, 48dp on Android, and 44px on a touch
    screen on the web, whatever the visible size. The button's layout size is its visible size:
    around a smaller button the touch area reaches past the container without taking room.
    A mouse has to be on the container itself.
  contrast: The label has 4.5:1 against the fill in every state, and 7:1 in high-contrast modes.

internationalization:
  right-to-left: The leading icon sits on the right and the trailing icon on the left.
  long-text: The label wraps and the button grows taller. The label is never truncated.
  scripts: Line height 1.4 clears stacked Vietnamese diacritics. CJK labels use system fonts.

motion:
  transitions: Fill and text color changes use button.transition.duration and its easing.
  reduced-motion: Color changes are immediate.

# Named examples. Stories, tests, and documentation are built from these.
examples:
  - id: variants
    description: Every variant at the default size.
    matrix:
      variant: [primary, secondary, ghost, danger]
  - id: sizes
    description: Every size of the primary button.
    matrix:
      size: [sm, md, lg]
    properties:
      variant: primary
  - id: disabled
    description: A disabled button.
    properties:
      disabled: true
  - id: loading
    description: A button whose action is in progress.
    properties:
      variant: primary
      loading: true
  - id: full-width
    description: A button stretched to its container.
    properties:
      variant: primary
      full-width: true
  - id: long-label
    description: A label too long for one line, which must wrap.
    properties:
      variant: primary
    label: Save all of these changes and send the updated version to every reviewer
