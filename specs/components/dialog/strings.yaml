# The text the Dialog's examples show, in every locale of the snapshot matrix
# (specs/snapshots.yaml): by example id, as in spec.yaml, then by the content the text fills.
# Every instance of an example shows the same text. The expanded pseudo-locale is derived from
# the English by the token build; it is never written here.
#
# The text is written as an app would ship it, in Unicode's composed form (NFC). The long title
# wraps onto a second line in every locale at the small width, and in Vietnamese it stacks
# diacritics on both lines; its buttons fit in a row in English and stack in the longer expanded
# text. The alert dialog's confirming button repeats the verb of its title.
examples:
  dialog:
    title:
      en: Rename file
      vi: Đổi tên tệp
      zh-Hans: 重命名文件
      ja: ファイル名を変更
      ko: 파일 이름 바꾸기
      ar: إعادة تسمية الملف
    description:
      en: Everyone the file is shared with sees the new name.
      vi: Mọi người được chia sẻ tệp đều thấy tên mới.
      zh-Hans: 此文件的所有共享对象都会看到新名称。
      ja: このファイルを共有しているすべてのユーザーに新しい名前が表示されます。
      ko: 이 파일을 공유받은 모든 사람에게 새 이름이 표시됩니다.
      ar: سيرى كل من تمت مشاركة الملف معه الاسم الجديد.
    cancel-label:
      en: Cancel
      vi: Hủy
      zh-Hans: 取消
      ja: キャンセル
      ko: 취소
      ar: إلغاء
    action-label:
      en: Rename
      vi: Đổi tên
      zh-Hans: 重命名
      ja: 名前を変更
      ko: 이름 바꾸기
      ar: إعادة تسمية
  close-button:
    title:
      en: Keyboard shortcuts
      vi: Phím tắt
      zh-Hans: 键盘快捷键
      ja: キーボードショートカット
      ko: 단축키
      ar: اختصارات لوحة المفاتيح
    body:
      en: Press N to start a new file, and S to share it.
      vi: Nhấn N để tạo tệp mới và S để chia sẻ tệp.
      zh-Hans: 按 N 新建文件，按 S 共享文件。
      ja: N キーで新しいファイルを作成し、S キーで共有します。
      ko: N 키를 눌러 새 파일을 만들고 S 키를 눌러 공유합니다.
      ar: اضغط N لإنشاء ملف جديد، وS لمشاركته.
    close-label:
      en: Close
      vi: Đóng
      zh-Hans: 关闭
      ja: 閉じる
      ko: 닫기
      ar: إغلاق
  long-title:
    title:
      en: Share the third-quarter sales report with everyone on your team
      vi: Chia sẻ báo cáo doanh số quý ba với mọi người trong nhóm của bạn
      zh-Hans: 将第三季度销售报告共享给你团队中的每一位成员
      ja: 第 3 四半期の売上レポートをチームの全員と共有
      ko: 3분기 판매 보고서를 팀의 모든 구성원과 공유
      ar: مشاركة تقرير مبيعات الربع الثالث مع جميع أعضاء فريقك
    cancel-label:
      en: Cancel
      vi: Hủy
      zh-Hans: 取消
      ja: キャンセル
      ko: 취소
      ar: إلغاء
    action-label:
      en: Share with your team
      vi: Chia sẻ với nhóm
      zh-Hans: 与团队共享
      ja: チームと共有
      ko: 팀과 공유
      ar: مشاركة مع فريقك
  alert-dialog:
    title:
      en: Delete this address?
      vi: Xóa địa chỉ này?
      zh-Hans: 删除此地址？
      ja: この住所を削除しますか？
      ko: 이 주소를 삭제할까요?
      ar: حذف هذا العنوان؟
    description:
      en: It is removed from your account. This cannot be undone.
      vi: Địa chỉ sẽ bị xóa khỏi tài khoản của bạn. Không thể hoàn tác thao tác này.
      zh-Hans: 此地址将从你的账户中移除。此操作无法撤消。
      ja: この住所はアカウントから削除されます。この操作は元に戻せません。
      ko: 이 주소가 계정에서 삭제됩니다. 이 작업은 되돌릴 수 없습니다.
      ar: ستتم إزالته من حسابك. لا يمكن التراجع عن ذلك.
    cancel-label:
      en: Cancel
      vi: Hủy
      zh-Hans: 取消
      ja: キャンセル
      ko: 취소
      ar: إلغاء
    action-label:
      en: Delete address
      vi: Xóa địa chỉ
      zh-Hans: 删除地址
      ja: 住所を削除
      ko: 주소 삭제
      ar: حذف العنوان
  sheet-edges:
    title:
      en: Filters
      vi: Bộ lọc
      zh-Hans: 筛选
      ja: フィルター
      ko: 필터
      ar: عوامل التصفية
    body:
      en: Show files shared with you in the last 30 days.
      vi: Hiển thị các tệp được chia sẻ với bạn trong 30 ngày qua.
      zh-Hans: 显示过去 30 天内与你共享的文件。
      ja: 過去 30 日間に共有されたファイルを表示します。
      ko: 지난 30일 동안 나와 공유된 파일을 표시합니다.
      ar: عرض الملفات التي تمت مشاركتها معك خلال آخر 30 يومًا.
    close-label:
      en: Close
      vi: Đóng
      zh-Hans: 关闭
      ja: 閉じる
      ko: 닫기
      ar: إغلاق
    action-label:
      en: Show results
      vi: Hiển thị kết quả
      zh-Hans: 显示结果
      ja: 結果を表示
      ko: 결과 보기
      ar: عرض النتائج
