# Reviewed adjustments to what the license gate sees. Both lists start empty.
#
# corrections: a package whose published license metadata is missing or wrong.
#   - package: name            # or name@version
#     license: MIT             # the SPDX expression that actually applies
#     evidence: https://...    # link to the LICENSE file that proves it
#
# exceptions: a package allowed although its license is not on the allowlist.
#   - package: name@version    # a version is required, so an upgrade is reviewed again
#     scope: dev               # ship or dev
#     reason: why it cannot be avoided and what it is used for
#     approved: 2026-11-14     # date of the review
#     review-by: 2027-05-14    # the gate fails again after this date
version: 1
corrections: []
exceptions:
  # mdn-data is a table of CSS property definitions published by Mozilla under CC0-1.0, a
  # public-domain dedication that the OSI has not approved. It reaches us through Astro
  # (astro -> svgo -> css-tree -> mdn-data) and is used only while building the documentation
  # site; nothing from it is shipped in a Raincoat package. There is no way to use Astro
  # without it. Closest alternative: a documentation tool that does not minify CSS with css-tree.
  - package: mdn-data@2.0.28
    scope: dev
    reason: CSS definition data required by Astro's CSS and SVG optimizers; build-time only, CC0 public-domain data.
    approved: 2026-11-14
    review-by: 2027-05-14
  - package: mdn-data@2.27.1
    scope: dev
    reason: CSS definition data required by Astro's CSS and SVG optimizers; build-time only, CC0 public-domain data.
    approved: 2026-11-14
    review-by: 2027-05-14
  # caniuse-lite is the "Can I use" table of browser support, published under CC-BY-4.0, which
  # the OSI has not approved. It reaches us through Next.js (next -> caniuse-lite), which reads it
  # while building apps/reference-web-next to choose the browsers it compiles for. The app is
  # private and never published, and nothing from the table is shipped in a Raincoat package.
  # There is no way to use Next.js without it. Its version moves with each data release, so a
  # lockfile update that brings a new one is reviewed again here.
  - package: caniuse-lite@1.0.30001826
    scope: dev
    reason: Browser support data that Next.js reads while building the Next.js reference app; build-time only, never shipped.
    approved: 2026-11-20
    review-by: 2027-05-20
