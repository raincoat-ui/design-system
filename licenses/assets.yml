# Every committed font file, and every file under themes/<id>/assets/, must match an entry here,
# or, for a file inside a theme's directory, an entry in that theme's own themes/<id>/assets.yml,
# in the same format with paths relative to the theme's directory.
#
#   - path: themes/alpha/fonts/BeVietnamPro-*.woff2   # a path or glob, relative to the repo root
#     kind: font                                      # font, icon, or brand
#     license: OFL-1.1
#     source: https://github.com/bettergui/BeVietnamPro
#
# Rules enforced by `pnpm licenses:assets`:
#   font   must be OFL-1.1
#   icon   must be a "ship" license from allowlist.yml
#   brand  must be LicenseRef-Brand-Proprietary and live under themes/<id>/assets/
version: 1
assets:
  - path: apps/docs/src/fonts/be-vietnam-pro-*.woff2
    kind: font
    license: OFL-1.1
    source: https://github.com/fontsource/font-files/tree/main/fonts/google/be-vietnam-pro
  - path: apps/docs/src/fonts/jetbrains-mono-*.woff2
    kind: font
    license: OFL-1.1
    source: https://github.com/fontsource/font-files/tree/main/fonts/google/jetbrains-mono
