<!doctype html>
<!-- The source of the docs site's share image, apps/docs/public/social-preview.png. It is set
     like the site's cover: white paper, the yellow cover stripe, the logo, the tagline in ink,
     and a 2px ink rule. Render it at 1200 x 630; brand/README.md has the command. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Raincoat share image</title>
    <style>
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 400;
        src: url("../apps/docs/src/fonts/be-vietnam-pro-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 500;
        src: url("../apps/docs/src/fonts/be-vietnam-pro-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 700;
        src: url("../apps/docs/src/fonts/be-vietnam-pro-latin-700-normal.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* Colors are the base theme's primitives: paper, ink, ink deep, graphite, raincoat yellow. */
      body {
        display: flex;
        flex-direction: column;
        padding: 76px 80px 52px;
        background: #ffffff;
        box-shadow: inset 0 12px 0 #f7d22a;
        color: #0c0d0f;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .logo {
        display: block;
        align-self: flex-start;
        width: auto;
        height: 56px;
      }

      h1 {
        margin-top: auto;
        max-width: 1040px;
        font-size: 70px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      p {
        max-width: 900px;
        margin-top: 26px;
        color: #5b5e61;
        font-size: 30px;
        line-height: 1.35;
        text-wrap: pretty;
      }

      footer {
        display: flex;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 18px;
        border-top: 2px solid #191b1d;
        color: #191b1d;
        font-size: 24px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="raincoat-logo.svg" alt="Raincoat" />
    <h1>One design-system foundation, compiled to native code.</h1>
    <p>SwiftUI for iOS, Jetpack Compose for Android, and React for the web, with a theme per app.</p>
    <footer>
      <span>raincoat-ui.github.io/design-system</span>
      <span>Apache-2.0</span>
    </footer>
  </body>
</html>
