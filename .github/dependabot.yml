# Dependency updates. A Swift entry is added when the Swift package gains a dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Published by hand without a provenance attestation, unlike 2.2.1 and the releases
      # before it, so pnpm's trustPolicy refuses it and every npm update job fails on it.
      # Remove this entry once a later lefthook release is published with provenance again.
      - dependency-name: lefthook
        versions: ["2.2.2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directories: ["/", "/apps/reference-android"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle:
        patterns: ["*"]
