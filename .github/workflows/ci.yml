name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, unit tests, token checks, license gates
        run: pnpm validate
      - name: Build the documentation site
        run: pnpm docs:build
      # A change to what a package ships must say so, in a changeset file. Tests, documents,
      # and development dependencies do not need one.
      - name: Changeset for changes that ship
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since=origin/main
      - name: Commit sign-off and pull request title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >-
          node tools/ci/check-commits.mjs --range "$BASE_SHA..$HEAD_SHA"
          --title "$PR_TITLE" --author "$PR_AUTHOR"

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Scan history for credentials
        run: node tools/ci/run-tool.mjs gitleaks git --redact --no-banner

  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check workflow syntax
        run: node tools/ci/run-tool.mjs actionlint
      - name: Audit workflow security
        run: node tools/ci/run-tool.mjs zizmor .github/workflows

  vulnerabilities:
    name: vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Scan the lockfile for known vulnerabilities
        run: node tools/ci/run-tool.mjs osv-scanner scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  swift-linux:
    name: swift tokens (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      # The token and theme modules use Foundation only. Testing them on Linux proves it, and
      # runs the iOS contract test without a macOS runner.
      - name: Build and test
        run: swift test --package-path packages/ios

  swift-macos:
    name: swift package (macos)
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Show the toolchain
        run: xcodebuild -version && swift --version
      - name: Test on macOS, including the SwiftUI layer
        run: swift test --package-path packages/ios
      - name: Build for iOS
        working-directory: packages/ios
        run: xcodebuild -scheme Raincoat-Package -destination 'generic/platform=iOS Simulator' build
      # The Swift package is published through a mirror repository. This builds an app target
      # against the tree the mirror would receive, so the mirror is known to stand on its own.
      - name: Build an app target against the Swift mirror tree
        run: |
          node tools/release/swift-mirror.mjs build/release/design-system-swift
          RAINCOAT_SWIFT_PATH="$PWD/build/release/design-system-swift" \
            swift build --package-path tools/release/consumers/swift

  # The SwiftUI components in an app on a simulator: what assistive technology is told, touch
  # targets, text sizes, and the system's accessibility audit.
  ios-reference:
    name: reference app (ios)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Show the toolchain and the simulators
        run: xcodebuild -version && xcrun simctl list devices available
      # A simulator that is still starting can refuse to launch the app, and has then hung the
      # tests until the job timed out. So it is started first, and waited for.
      - name: Start an iPhone simulator on the newest iOS
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | { version: (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)]),
                  device: (.value[] | select(.name == "iPhone 17")) } ]
            | sort_by(.version) | last | .device.udid')
          test -n "$udid" && test "$udid" != "null"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Each test has a time limit, and a test that fails is run once more: a second failure is
      # a real one.
      - name: Run the UI tests on the simulator
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test \
            -project apps/reference-ios/ReferenceApp.xcodeproj \
            -scheme ReferenceApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath build/reference-ios \
            -resultBundlePath build/reference-ios/results.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 240 \
            -retry-tests-on-failure \
            -test-iterations 2
      - name: Keep the test results when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-ios-results
          path: build/reference-ios/results.xcresult
          retention-days: 7

  kotlin:
    name: android modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Gradle wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      # Robolectric downloads the Android runtime it tests against when the tests start, outside
      # Gradle, into ~/.m2. Without a cache, a rate limit at Maven's mirror fails the tests. The
      # restore key lets a changed build file start from the previous downloads.
      - name: Cache Gradle and Robolectric downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      # The token and theme modules are plain Kotlin. The Compose components are an Android
      # library, built with the Android SDK that the runner provides, and their tests run on
      # the JVM with Robolectric, so no emulator is needed. licensee is the license gate for
      # shipped dependencies.
      - name: Test, and check the licenses of shipped dependencies
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew test licensee --no-daemon --console=plain

  # The Compose components in an app on an emulator: what an accessibility service is given,
  # Google's accessibility checks, and touches.
  android-reference:
    name: reference app (android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Gradle wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-emulator-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-emulator-${{ runner.os }}-
      # The emulator needs hardware acceleration, which the runner allows once KVM is opened up.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The app installs the modules from a Maven repository, as any app does: the one this
      # checkout stages.
      - name: Stage the Android modules
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew publishAllPublicationsToStagingRepository --no-daemon --console=plain --quiet
      # Built before the emulator starts, so that a build failure is not mistaken for a test
      # failure and does not wait for the emulator to boot.
      - name: Build the app and its tests
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew -p apps/reference-android assembleDebug assembleDebugAndroidTest \
            --no-daemon --console=plain --stacktrace
      # An open-source Android image made for automated tests, with no Google services.
      - name: Run the tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          # A phone-sized screen, so that the first sections of the app fit without scrolling.
          profile: pixel_6
          script: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew -p apps/reference-android connectedDebugAndroidTest --no-daemon --console=plain --stacktrace
      - name: Keep the test report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-android-report
          path: apps/reference-android/build/reports/androidTests
          retention-days: 7

  web:
    name: react components
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm web:typecheck
      # The browser build is the one the pinned Playwright version expects.
      - name: Install Chromium
        run: pnpm --filter @raincoat-ui/react exec playwright install --with-deps --only-shell chromium
      # Builds the package, checks what was built, then runs the component tests in Chromium
      # against the token source, in every color mode and density.
      - name: Build and test
        run: pnpm web:test

  web-reference:
    name: reference app (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @raincoat-ui/reference-web-vite exec playwright install --with-deps --only-shell chromium
      # Builds the React package, which the app installs from this workspace, checks the app's
      # types, then builds the app for production and runs its tests against it in Chromium.
      - name: Build and test
        run: pnpm web:reference
      - name: Keep the test traces when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-web-results
          path: apps/reference-web-vite/test-results
          retention-days: 7

  # A rehearsal of the release: everything it would publish is built and then installed the
  # way an app would install it. Nothing is published.
  release-rehearsal:
    name: release rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the Gradle wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
      - name: Build everything a release publishes
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          node tools/release/stage.mjs
      - name: Install the npm packages as an app would
        run: node tools/release/consumers/npm-check.mjs --tarballs build/release/npm
      - name: Build an Android app module against the staged Maven repository
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          version="$(node --print 'require("./build/release/release.json").version')"
          ./gradlew -p tools/release/consumers/android compileDebugKotlin \
            "-PraincoatRepository=$PWD/build/release/maven" "-PraincoatVersion=$version" \
            --no-daemon --console=plain

  # The only required status check. It passes when every job above passed, or was skipped by
  # a path rule, so path filters can never leave a required check waiting forever.
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [
        validate,
        secrets,
        workflows,
        vulnerabilities,
        swift-linux,
        swift-macos,
        ios-reference,
        kotlin,
        android-reference,
        web,
        web-reference,
        release-rehearsal,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
