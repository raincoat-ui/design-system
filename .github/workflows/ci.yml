name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, unit tests, token checks, license gates
        run: pnpm validate
      - name: Build the documentation site
        run: pnpm docs:build
      # A change to what a package ships must say so, in a changeset file. Tests, documents,
      # and development dependencies do not need one.
      - name: Changeset for changes that ship
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since=origin/main
      - name: Commit sign-off and pull request title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >-
          node tools/ci/check-commits.mjs --range "$BASE_SHA..$HEAD_SHA"
          --title "$PR_TITLE" --author "$PR_AUTHOR"

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Scan history for credentials
        run: node tools/ci/run-tool.mjs gitleaks git --redact --no-banner

  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check workflow syntax
        run: node tools/ci/run-tool.mjs actionlint
      - name: Audit workflow security
        run: node tools/ci/run-tool.mjs zizmor .github/workflows

  vulnerabilities:
    name: vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Scan the lockfile for known vulnerabilities
        run: node tools/ci/run-tool.mjs osv-scanner scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  swift-linux:
    name: swift tokens (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      # The token and theme modules use Foundation only. Testing them on Linux proves it, and
      # runs the iOS contract test without a macOS runner.
      - name: Build and test
        run: swift test --package-path packages/ios

  swift-macos:
    name: swift package (macos)
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Show the toolchain
        run: xcodebuild -version && swift --version
      - name: Test on macOS, including the SwiftUI layer
        run: swift test --package-path packages/ios
      - name: Build for iOS
        working-directory: packages/ios
        run: xcodebuild -scheme Raincoat-Package -destination 'generic/platform=iOS Simulator' build
      # The Swift package is published through a mirror repository. This builds an app target
      # against the tree the mirror would receive, so the mirror is known to stand on its own.
      - name: Build an app target against the Swift mirror tree
        run: |
          node tools/release/swift-mirror.mjs build/release/design-system-swift
          RAINCOAT_SWIFT_PATH="$PWD/build/release/design-system-swift" \
            swift build --package-path tools/release/consumers/swift
      # Each theme is a product an app can link alone.
      - name: Build each theme product on its own
        run: node tools/release/consumers/themes-alone.mjs --swift build/release/design-system-swift

  kotlin:
    name: android modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Gradle wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      # Robolectric downloads the Android runtime it tests against when the tests start, outside
      # Gradle, into ~/.m2. Without a cache, a rate limit at Maven's mirror fails the tests. The
      # restore key lets a changed build file start from the previous downloads.
      - name: Cache Gradle and Robolectric downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      # The token and theme modules are plain Kotlin. The Compose components are an Android
      # library, built with the Android SDK that the runner provides, and their tests run on
      # the JVM with Robolectric, so no emulator is needed. licensee is the license gate for
      # shipped dependencies.
      #
      # The tests include the visual snapshots of the Compose components: every snapshot of
      # specs/snapshots.yaml, in every theme, compared with its baseline in
      # packages/android/ui/src/test/__screenshots__. A missing or different baseline fails the
      # job. --continue runs the other tests and the license gate all the same.
      - name: Test, and check the licenses of shipped dependencies
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew test licensee --continue --no-daemon --console=plain
      # What the snapshots drew for a baseline that is missing or differs, laid out as the
      # baselines are, so that it can be reviewed and committed (CONTRIBUTING.md).
      - name: Keep what the snapshots drew
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-snapshots
          path: packages/android/ui/build/snapshots/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: react components (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        if: matrix.browser == 'chromium'
        run: pnpm web:typecheck
      # The browser build is the one the pinned Playwright version expects. For Chromium, the
      # headless shell is enough.
      - name: Install the browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm --filter @raincoat-ui/react exec playwright install --with-deps --only-shell "$BROWSER"
      # Builds the package, checks what was built, then runs the component tests in the browser
      # against the token source, in every theme, color mode, and density.
      - name: Build and test
        env:
          RAINCOAT_BROWSER: ${{ matrix.browser }}
        run: pnpm web:test

  # The visual snapshots of the React components, in Chromium: every snapshot of
  # specs/snapshots.yaml, in every theme, compared with its baseline in
  # packages/web/test/snapshots/__screenshots__. A missing or different baseline fails the job.
  # What the job drew for those is uploaded, laid out as the baselines are, so that it can be
  # reviewed and committed (CONTRIBUTING.md).
  web-snapshots:
    name: web snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The snapshots draw Arabic, Chinese, Japanese, Korean, and Vietnamese. No theme ships a
      # font yet, so the text is set in the system's fonts: Ubuntu's Noto packages, the same
      # files on every run.
      - name: Install Chromium and the fonts
        run: |
          pnpm --filter @raincoat-ui/react exec playwright install --with-deps --only-shell chromium
          sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-noto-cjk
      - name: Draw the snapshots and compare them with their baselines
        run: pnpm web:snapshots
      - name: Keep what the snapshots drew
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-snapshots
          path: packages/web/test-results/snapshots/
          if-no-files-found: ignore
          retention-days: 14

  # The visual snapshots of the SwiftUI components, drawn by iOS in a simulator with SwiftUI's
  # ImageRenderer: every snapshot of specs/snapshots.yaml, in every theme, compared with its
  # baseline in packages/ios/__screenshots__. A missing or different baseline fails the job. What
  # the job drew for those is uploaded, laid out as the baselines are, so that it can be reviewed
  # and committed (CONTRIBUTING.md). The tests run only when RAINCOAT_SNAPSHOTS is set, so the
  # other Swift jobs leave them out.
  ios-snapshots:
    name: ios snapshots
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Show the toolchain and the simulators
        run: xcodebuild -version && xcrun simctl list devices available
      # As in the reference apps: the simulator is started first, and waited for.
      - name: Start an iPhone simulator on the newest iOS
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | { version: (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)]),
                  device: (.value[] | select(.name == "iPhone 17")) } ]
            | sort_by(.version) | last | .device.udid')
          test -n "$udid" && test "$udid" != "null"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # xcodebuild hands TEST_RUNNER_ variables to the tests without the prefix. The tests read the
      # baselines from this checkout and write what they drew into it, which the simulator can do.
      - name: Draw the snapshots and compare them with their baselines
        working-directory: packages/ios
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_RAINCOAT_SNAPSHOTS: "1"
          TEST_RUNNER_CI: "true"
        run: |
          xcodebuild test \
            -scheme Raincoat-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath ../../build/ios-snapshots \
            -only-testing:RaincoatTests/VisualSnapshots
      - name: Keep what the snapshots drew
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-snapshots
          path: packages/ios/test-results/snapshots/
          if-no-files-found: ignore
          retention-days: 14

  # The reference apps, with the packages built from this commit: on an iOS simulator, an
  # Android emulator, and in Chromium.
  reference-apps:
    name: reference apps
    permissions:
      contents: read
    # zizmor asks for GitHub's newer `$/` form, which actionlint 1.7.12 rejects.
    uses: ./.github/workflows/reference-apps.yml # zizmor: ignore[self-repository]
    with:
      tree: true

  # A rehearsal of the release: everything it would publish is built and then installed the
  # way an app would install it. Nothing is published.
  release-rehearsal:
    name: release rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the Gradle wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
      - name: Build everything a release publishes
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          node tools/release/stage.mjs
      - name: Install the npm packages as an app would, and each theme on its own
        run: node tools/release/consumers/npm-check.mjs --tarballs build/release/npm
      - name: Build an Android app module against the staged Maven repository
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          version="$(node --print 'require("./build/release/release.json").version')"
          ./gradlew -p tools/release/consumers/android compileDebugKotlin \
            "-PraincoatRepository=$PWD/build/release/maven" "-PraincoatVersion=$version" \
            --no-daemon --console=plain
      - name: Each Android theme module brings only the token types with it
        run: |
          version="$(node --print 'require("./build/release/release.json").version')"
          node tools/release/consumers/themes-alone.mjs --maven build/release/maven "$version"
      # A theme kept outside this repository, built with the token build's command line from
      # its tarball, then compiled against the staged Swift mirror and Maven repository.
      - name: Build a theme pack with the command line
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          node tools/release/consumers/theme-pack.mjs --tarballs build/release/npm \
            --swift build/release/design-system-swift --maven build/release/maven

  # The only required status check. It passes when every job above passed, or was skipped by
  # a path rule, so path filters can never leave a required check waiting forever.
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [
        validate,
        secrets,
        workflows,
        vulnerabilities,
        swift-linux,
        swift-macos,
        kotlin,
        web,
        web-snapshots,
        ios-snapshots,
        reference-apps,
        release-rehearsal,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
